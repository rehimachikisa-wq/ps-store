<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation Store & Game Zone</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #121212;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #aaaaaa;
            --tg-theme-button-color: #0070d1;
            --tg-theme-button-text-color: #ffffff;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        header {
            background-color: #003087;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            color: #fff;
        }

        header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #d0d0d0;
        }

        .container {
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
            box-sizing: border-box;
        }

        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
        }

        .category-btn {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .category-btn.active {
            background: var(--tg-theme-button-color, #0070d1);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #2a2a2a;
        }

        .product-img-container {
            width: 100%;
            height: 130px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
            line-height: 1.2;
        }

        .product-desc {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #aaa);
            margin: 0 0 8px 0;
            flex-grow: 1;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-size: 14px;
            font-weight: bold;
            color: #4cd137;
        }

        .add-btn {
            background-color: var(--tg-theme-button-color, #0070d1);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Cart Drawer / Bottom Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1b1b1b;
            border-top: 1px solid #333;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .cart-info {
            font-size: 14px;
        }

        .cart-total {
            font-weight: bold;
            color: #4cd137;
        }

        .checkout-btn {
            background-color: #4cd137;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* Modal Overlay for Cart Details */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background-color: #1e1e1e;
            width: 100%;
            max-height: 80vh;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 40vh;
            margin-bottom: 14px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: #333;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>PlayStation Store & Game Zone</h1>
        <p>Consoles, Joysticks & Accessories</p>
    </header>

    <div class="container">
        <input type="text" id="searchBar" class="search-bar" placeholder="Search gear or games..." oninput="filterProducts()">

        <div class="categories" id="categoryContainer">
            <button class="category-btn active" onclick="setCategory('All', this)">All</button>
            <button class="category-btn" onclick="setCategory('Consoles', this)">Consoles</button>
            <button class="category-btn" onclick="setCategory('Controllers', this)">Controllers</button>
            <button class="category-btn" onclick="setCategory('Accessories', this)">Accessories</button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Dynamic Products Generated by JS -->
        </div>
    </div>

    <!-- Bottom Cart Summary Bar -->
    <div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
        <div class="cart-info">
            <span id="cartCount">0 items</span> | <span class="cart-total" id="cartTotal">0 ETB</span>
        </div>
        <button class="checkout-btn">View Cart</button>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Your Cart</h3>
                <button class="close-modal" onclick="closeCartModal()">✕</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <!-- Cart items populate here -->
            </div>
            <button class="checkout-btn" style="width: 100%; padding: 12px;" onclick="checkoutWithChapa()">Proceed to Checkout (Chapa)</button>
        </div>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Product Catalog Data with Corrected Images and PS4 Pro Image Update
        const products = [
            {
                id: "ps5-console",
                name: "PlayStation 5 Console",
                price: 65000,
                category: "Consoles",
                image: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&w=500&q=80",
                description: "PS5 Console Standard Edition with Ultra-High Speed SSD"
            },
            {
                id: "ps4-slim",
                name: "PlayStation 4 Slim",
                price: 28000,
                category: "Consoles",
                image: "https://images.unsplash.com/photo-1507457373958-b7ebc787593e?auto=format&fit=crop&w=500&q=80",
                description: "500GB / 1TB Sleek Console with DualShock 4 Controller"
            },
            {
                id: "ps4-pro",
                name: "PlayStation 4 Pro",
                price: 35000,
                category: "Consoles",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7gXWPhy2UvS63DZs9IdLxh5M0GjqQg-gHXyl2vMhkyeLeYdviYprEEEDC&s=10",
                description: "1TB 4K-Enabled Gaming Console with DualShock 4 Controller"
            },
            {
                id: "dualSense-controller",
                name: "DualSense Wireless Controller",
                price: 6500,
                category: "Controllers",
                image: "https://images.unsplash.com/photo-1607853202273-797f1c22a38e?auto=format&fit=crop&w=500&q=80",
                description: "Official PS5 Controller with haptic feedback & adaptive triggers"
            },
            {
                id: "dualShock-4",
                name: "DualShock 4 Controller",
                price: 3500,
                category: "Controllers",
                image: "https://images.unsplash.com/photo-1592840496694-26d035b52b48?auto=format&fit=crop&w=500&q=80",
                description: "Official Wireless Controller for PlayStation 4"
            },
            {
                id: "pulse-3d",
                name: "Pulse 3D Wireless Headset",
                price: 9500,
                category: "Accessories",
                image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=500&q=80",
                description: "Headset fine-tuned for 3D Audio on PS5 consoles"
            },
            {
                id: "charging-dock",
                name: "DualSense Charging Station",
                price: 3200,
                category: "Accessories",
                image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80",
                description: "Dock up to two DualSense wireless controllers easily"
            }
        ];

        let cart = {};
        let currentCategory = 'All';

        // Render products to grid
        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888;">No items found</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${product.image}" class="product-img" alt="${product.name}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80'">
                    </div>
                    <div class="product-info">
                        <h4 class="product-title">${product.name}</h4>
                        <p class="product-desc">${product.description}</p>
                        <div class="product-footer">
                            <span class="product-price">${product.price.toLocaleString()} ETB</span>
                            <button class="add-btn" onclick="addToCart('${product.id}')">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            let filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'All' || p.category === currentCategory;
                const matchesQuery = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderProducts(filtered);
        }

        function addToCart(productId) {
            if (!cart[productId]) {
                cart[productId] = { ...products.find(p => p.id === productId), qty: 1 };
            } else {
                cart[productId].qty++;
            }
            updateCartUI();
        }

        function updateCartQty(productId, change) {
            if (cart[productId]) {
                cart[productId].qty += change;
                if (cart[productId].qty <= 0) {
                    delete cart[productId];
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;
            let listHTML = '';

            for (let id in cart) {
                let item = cart[id];
                totalItems += item.qty;
                totalPrice += item.price * item.qty;

                listHTML += `
                    <div class="cart-item-row">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>${item.price.toLocaleString()} ETB x ${item.qty}</small>
                        </div>
                        <div class="cart-item-controls">
                            <button class="qty-btn" onclick="updateCartQty('${id}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateCartQty('${id}', 1)">+</button>
                        </div>
                    </div>
                `;
            }

            document.getElementById('cartItemsList').innerHTML = listHTML || '<p style="text-align:center; color:#888;">Your cart is empty</p>';
            document.getElementById('cartCount').innerText = `${totalItems} item${totalItems === 1 ? '' : 's'}`;
            document.getElementById('cartTotal').innerText = `${totalPrice.toLocaleString()} ETB`;

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.style.display = 'flex';
            } else {
                cartBar.style.display = 'none';
                closeCartModal();
            }
        }

        function openCartModal() {
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function checkoutWithChapa() {
            let cartData = [];
            let totalPrice = 0;

            for (let id in cart) {
                cartData.push({ id: cart[id].id, name: cart[id].name, price: cart[id].price, quantity: cart[id].qty });
                totalPrice += cart[id].price * cart[id].qty;
            }

            if (cartData.length === 0) return;

            // Payload sent back to your backend/bot for Chapa payment initialization
            const payload = {
                user: tg.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : (tg.initDataUnsafe?.user?.id || 'iamanteneh'),
                items: cartData,
                total: totalPrice
            };

            // Send data back to Telegram bot container if opened as WebApp
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }

        // Initial render
        renderProducts(products);
    </script>
</body>
</html>
