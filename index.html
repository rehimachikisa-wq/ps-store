<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStation Storefront</title>
    <!-- Telegram Web App script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #121212;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #aaaaaa;
            --tg-theme-button-color: #0070d1;
            --tg-theme-button-text-color: #ffffff;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #0070d1;
        }

        header p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #aaa);
            margin: 0;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .category-filter::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--tg-theme-text-color);
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-btn.active {
            background-color: var(--tg-theme-button-color, #0070d1);
            border-color: var(--tg-theme-button-color, #0070d1);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #2a2a2a;
        }

        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #2a2a2a;
        }

        .product-info {
            margin-top: 8px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-desc {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #aaa);
            margin: 0 0 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .product-price {
            font-size: 14px;
            font-weight: bold;
            color: #4cd964;
        }

        .add-to-cart-btn {
            background-color: var(--tg-theme-button-color, #0070d1);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .cart-info {
            font-size: 14px;
            font-weight: 550;
        }

        .checkout-btn {
            background-color: #4cd964;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>PlayStation Store</h1>
        <p>Consoles, Controllers, Games & Subscriptions</p>
    </header>

    <div class="category-filter" id="categoryFilter">
        <button class="filter-btn active" onclick="filterProducts('All')">All</button>
        <button class="filter-btn" onclick="filterProducts('Console')">Consoles</button>
        <button class="filter-btn" onclick="filterProducts('Controller')">Controllers</button>
        <button class="filter-btn" onclick="filterProducts('Game')">Games</button>
        <button class="filter-btn" onclick="filterProducts('Subscription')">Subscriptions</button>
    </div>

    <div class="product-grid" id="productGrid">
        <!-- Products injected via JS -->
    </div>

    <div class="cart-bar" id="cartBar" style="display: none;">
        <div class="cart-info" id="cartInfo">0 items | Total: $0.00</div>
        <button class="checkout-btn" onclick="checkoutWithChapa()">Checkout with Chapa</button>
    </div>

    <script>
        // Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Product Inventory (Including correct hardware variants and new PS Plus plans)
        const products = [
            {
                id: "ps5-console",
                name: "PlayStation 5 Console",
                category: "Console",
                price: 499.99,
                description: "Brand new PS5 console with ultra-high speed SSD and DualSense wireless controller included.",
                image: "images/ps5.jpg"
            },
            {
                id: "ps4-slim-console",
                name: "PlayStation 4 Slim Console",
                category: "Console",
                price: 299.99,
                description: "Sleek PS4 Slim console delivering awesome gaming power with 1TB storage.",
                image: "images/ps4-slim.jpg"
            },
            {
                id: "ps5-controller",
                name: "PS5 DualSense Wireless Controller",
                category: "Controller",
                price: 69.99,
                description: "Official Sony DualSense wireless controller for PlayStation 5 with haptic feedback.",
                image: "images/ps5-controller.jpg"
            },
            {
                id: "ps4-controller",
                name: "PS4 DualShock 4 Controller",
                category: "Controller",
                price: 59.99,
                description: "Original DualShock 4 wireless controller for PlayStation 4 systems.",
                image: "images/ps4-controller.jpg"
            },
            {
                id: "fc25-game",
                name: "EA Sports FC 25 (PS5)",
                category: "Game",
                price: 69.99,
                description: "The newest football experience featuring HyperMotionV technology.",
                image: "images/fc25.jpg"
            },
            // --- PS PLUS SUBSCRIPTION PLANS ---
            {
                id: "ps-plus-essential-1m",
                name: "PS Plus Essential (1 Month)",
                category: "Subscription",
                price: 20.99,
                description: "Core features including online multiplayer access, monthly downloadable games, exclusive PS Store discounts, and 100GB cloud storage.",
                image: "images/ps-plus-essential.jpg"
            },
            {
                id: "ps-plus-extra-1m",
                name: "PS Plus Extra (1 Month)",
                category: "Subscription",
                price: 26.99,
                description: "Includes Essential features plus access to a massive game catalog of over 400 PS4 and PS5 titles, featuring blockbuster hits like The Last of Us Part I and indie favorites.",
                image: "images/ps-plus-extra.jpg"
            },
            {
                id: "ps-plus-deluxe-1m",
                name: "PS Plus Deluxe (1 Month)",
                category: "Subscription",
                price: 29.99,
                description: "The ultimate pass including Essential & Extra perks, plus the Classics retro catalog, time-limited game trials, and access to masterpieces like The Last of Us Part I and The Last of Us Part II Remastered.",
                image: "images/ps-plus-deluxe.jpg"
            },
            {
                id: "ps-plus-essential-3m",
                name: "PS Plus Essential (3 Months)",
                category: "Subscription",
                price: 37.99,
                description: "3 months of core features including online multiplayer access, monthly free downloadable games, exclusive discounts, and 100GB cloud storage.",
                image: "images/ps-plus-essential-3m.jpg"
            },
            {
                id: "ps-plus-extra-3m",
                name: "PS Plus Extra (3 Months)",
                category: "Subscription",
                price: 49.99,
                description: "3 months of Essential features plus unlimited access to over 400 PS4 and PS5 catalog titles, including hits like The Last of Us Part I.",
                image: "images/ps-plus-extra-3m.jpg"
            },
            {
                id: "ps-plus-deluxe-3m",
                name: "PS Plus Deluxe (3 Months)",
                category: "Subscription",
                price: 59.99,
                description: "3 months of the ultimate package: Extra catalog games, classic retro games, game trials, and titles like The Last of Us Part I and The Last of Us Part II Remastered.",
                image: "images/ps-plus-deluxe-3m.jpg"
            },
            {
                id: "ps-plus-essential-12m",
                name: "PS Plus Essential (12 Months)",
                category: "Subscription",
                price: 89.99,
                description: "A full year of online multiplayer, monthly downloadable games, exclusive store discounts, and 100GB cloud storage at the best value.",
                image: "images/ps-plus-essential-12m.jpg"
            },
            {
                id: "ps-plus-extra-12m",
                name: "PS Plus Extra (12 Months)",
                category: "Subscription",
                price: 145.99,
                description: "A full year of Essential perks plus 365 days of access to a massive library of 400+ games, featuring blockbuster titles like The Last of Us Part I.",
                image: "images/ps-plus-extra-12m.jpg"
            },
            {
                id: "ps-plus-deluxe-12m",
                name: "PS Plus Deluxe (12 Months)",
                category: "Subscription",
                price: 169.99,
                description: "The ultimate 1-year pass: full access to the Extra library, retro Classics catalog, game trials, and top-tier masterpieces like The Last of Us Part I and The Last of Us Part II Remastered.",
                image: "images/ps-plus-deluxe-12m.jpg"
            }
        ];

        let cart = {};

        function renderProducts(filterCategory = 'All') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = filterCategory === 'All' 
                ? products 
                : products.filter(p => p.category === filterCategory);

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/150?text=PlayStation'">
                    <div class="product-info">
                        <div>
                            <div class="product-title">${product.name}</div>
                            <div class="product-desc">${product.description}</div>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">$${product.price.toFixed(2)}</span>
                            <button class="add-to-cart-btn" onclick="addToCart('${product.id}')">Add</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === category.toLowerCase() || (category === 'All' && btn.innerText === 'All')) {
                    btn.classList.add('active');
                }
            });
            renderProducts(category);
        }

        function addToCart(productId) {
            if(cart[productId]) {
                cart[productId].qty += 1;
            } else {
                const product = products.find(p => p.id === productId);
                cart[productId] = { ...product, qty: 1 };
            }
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            const cartInfo = document.getElementById('cartInfo');
            
            let totalItems = 0;
            let totalPrice = 0;

            for(let id in cart) {
                totalItems += cart[id].qty;
                totalPrice += cart[id].price * cart[id].qty;
            }

            if(totalItems > 0) {
                cartBar.style.display = 'flex';
                cartInfo.innerText = `${totalItems} item(s) | Total: $${totalPrice.toFixed(2)}`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function checkoutWithChapa() {
            let totalPrice = 0;
            let itemsSummary = [];
            
            for(let id in cart) {
                totalPrice += cart[id].price * cart[id].qty;
                itemsSummary.push(`${cart[id].name} (x${cart[id].qty})`);
            }

            // Send data back to Telegram bot or trigger Chapa payment handler
            const orderData = {
                items: itemsSummary,
                total: totalPrice,
                user: tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.id || "guest"
            };

            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }

        // Initial render
        renderProducts('All');
    </script>
</body>
</html>
