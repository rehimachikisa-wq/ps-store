<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Super PlayStation Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 100px; }
    
    header { padding: 16px; background: #090d16; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #fff; text-align: center; }

    .nav-tabs { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background-color: var(--bg-color); }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 16px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    
    .product-img { width: 100%; height: 130px; object-fit: cover; background: #0f172a; }
    .product-details { padding: 12px; }
    .product-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .product-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.3; }
    .product-price { font-size: 0.9rem; font-weight: 700; color: #4ade80; margin-bottom: 10px; }

    .select-btn { background: var(--accent-blue); color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; width: 100%; cursor: pointer; }
    .select-btn.selected { background: var(--accent-green); }

    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #090d16; border-top: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
    .checkout-btn { background: var(--accent-green); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .checkout-btn:disabled { background: #334155; color: var(--text-muted); cursor: not-allowed; }

    /* Payment Modal Popup */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center; padding: 20px; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .payment-box { background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; margin: 14px 0; text-align: left; font-size: 0.88rem; line-height: 1.7; }
    .payment-box code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-weight: bold; }
    
    .chat-btn { display: block; background: var(--accent-blue); color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; text-align: center; margin-top: 12px; }
    .close-btn { background: transparent; color: var(--text-muted); border: none; padding: 8px; font-size: 0.8rem; width: 100%; cursor: pointer; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Super PlayStation Store</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="filterCategory('all', this)">All Products</button>
    <button class="tab-btn" onclick="filterCategory('console', this)">Consoles</button>
    <button class="tab-btn" onclick="filterCategory('accessory', this)">Controllers</button>
  </div>

  <div class="product-grid" id="catalog"></div>

  <div class="cart-bar">
    <div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">Selected:</div>
      <div id="cart-item" style="font-size: 0.85rem; font-weight: 600;">None</div>
    </div>
    <button class="checkout-btn" id="checkout-btn" disabled onclick="showPaymentModal()">Confirm Order</button>
  </div>

  <!-- Payment Modal Window -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-card">
      <div class="modal-title">💵 Payment Transfer Info</div>
      <p style="font-size: 0.85rem; color: #4ade80; font-weight: 600;" id="modal-order-summary"></p>
      
      <div class="payment-box">
        <strong>Please transfer the exact amount:</strong><br><br>
        🏦 <strong>CBE Bank:</strong> <code>1000355132351</code><br>
        📱 <strong>Telebirr:</strong> <code>0924474307</code><br><br>
        📌 <i>After completing the transfer, click below to send your screenshot directly to us on Telegram:</i>
      </div>

      <a id="admin-chat-link" href="https://t.me/iamanteneh" target="_blank" class="chat-btn">📩 Send Receipt to @iamanteneh</a>
      <button class="close-btn" onclick="closePaymentModal()">Close Window</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const products = [
      { id: "ps4_slim_norm", name: "PS4 Slim 500GB", desc: "Clean original console with 1 controller.", price: 58000, cat: "console", img: "https://images.unsplash.com/photo-1507457379470-08b800bebc67?w=400&q=80" },
      { id: "ps4_slim_jb", name: "PS4 Slim Jailbreak", desc: "Loaded with 20+ top games preinstalled.", price: 72000, cat: "console", img: "https://images.unsplash.com/photo-1507457379470-08b800bebc67?w=400&q=80" },
      { id: "ps4_pro_jb", name: "PS4 Pro Jailbreak", desc: "4K Gaming power with full game library.", price: 75000, cat: "console", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400&q=80" },
      { id: "ps5_pro", name: "PS5 Console", desc: "Next-gen ultra-high speed console.", price: 185000, cat: "console", img: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=400&q=80" },
      { id: "ps4_joy", name: "PS4 Controller", desc: "Original DualShock 4 Wireless Joystick.", price: 6000, cat: "accessory", img: "https://images.unsplash.com/photo-1592840496694-26d035b52b48?w=400&q=80" },
      { id: "ps5_joy", name: "PS5 Controller", desc: "Original DualSense Wireless Joystick.", price: 13000, cat: "accessory", img: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=400&q=80" }
    ];

    let selectedProduct = null;

    function renderCatalog(filter = 'all') {
      const container = document.getElementById('catalog');
      container.innerHTML = '';
      const items = filter === 'all' ? products : products.filter(p => p.cat === filter);

      items.forEach(p => {
        const isSelected = selectedProduct && selectedProduct.id === p.id;
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${p.img}" class="product-img" alt="${p.name}">
          <div class="product-details">
            <div class="product-title">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="product-price">${p.price.toLocaleString()} ETB</div>
            <button class="select-btn ${isSelected ? 'selected' : ''}" onclick="selectItem('${p.id}')">
              ${isSelected ? '✓ Selected' : 'Select'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(category, btnElement) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderCatalog(category);
    }

    function selectItem(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('cart-item').innerText = `${selectedProduct.name} (${selectedProduct.price.toLocaleString()} ETB)`;
      
      const btn = document.getElementById('checkout-btn');
      btn.disabled = false;
      btn.innerText = `Order for ${selectedProduct.price.toLocaleString()} ETB`;
      
      renderCatalog(document.querySelector('.tab-btn.active').getAttribute('onclick').includes('console') ? 'console' : document.querySelector('.tab-btn.active').getAttribute('onclick').includes('accessory') ? 'accessory' : 'all');
    }

    function showPaymentModal() {
      if (!selectedProduct) return;
      document.getElementById('modal-order-summary').innerText = `Order: ${selectedProduct.name} (${selectedProduct.price.toLocaleString()} ETB)`;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
      if (tg) tg.close();
    }

    renderCatalog();
  </script>
</body>
</html>
